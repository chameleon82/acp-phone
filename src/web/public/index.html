<!doctype html>
<html lang="en" class="call-page">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>ACP Phone</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="call-screen">
    <section id="contacts-view" class="contacts-view" aria-labelledby="contacts-heading">
        <p class="eyebrow">ACP PHONE</p>
        <h1 id="contacts-heading">Agents</h1>
        <p class="contacts-hint">Choose an agent to start a call.</p>
        <p id="contacts-status" class="status" role="status" aria-live="polite">Loading agents…</p>
        <div id="agent-list" class="agent-list"></div>
    </section>
    <select id="target" aria-label="ACP agent target" hidden></select>
    <section id="call-view" class="call-view" aria-label="Voice call" hidden>
    <header class="call-header">
        <p class="eyebrow">ACP PHONE</p>
        <button id="target-profile" class="agent-profile" type="button" aria-label="Call selected agent">
            <span id="avatar" class="avatar" aria-hidden="true">AI</span>
        </button>
        <h1 id="target-label">Choose an agent</h1>
        <p id="call-timer" class="call-timer" aria-live="off">Ready to call</p>
        <p id="status" class="status" role="status" aria-live="polite">Choose an agent to begin</p>
    </header>

    <section class="voice-stage" aria-label="Call activity">
        <div class="voice-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
        <p id="voice-prompt">Start a call to speak with your agent.</p>
    </section>

    <section class="call-controls" aria-label="Call controls">
        <button id="mute" class="control-button" type="button" disabled aria-pressed="false">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="9" y="2" width="6" height="12" rx="3" />
                <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" />
            </svg>
            <span id="mute-label">Mic off</span>
        </button>
        <button id="call" class="call-button" type="button" aria-pressed="false" disabled>
            <svg id="call-icon" class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.69 2.8a2 2 0 0 1-.45 2.11L8.09 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.33 1.84.56 2.8.69A2 2 0 0 1 22 16.92Z" />
            </svg>
            <span id="call-label">Call</span>
        </button>
        <button id="speaker" class="control-button active" type="button" disabled aria-pressed="true">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M11 4 6 8H3v8h3l5 4V4ZM15 8a6 6 0 0 1 0 8M18 4a11 11 0 0 1 0 16" />
            </svg>
            <span>Speaker</span>
        </button>
    </section>

    <section class="conversation" aria-labelledby="conversation-heading">
        <div class="conversation-heading"><h2 id="conversation-heading">Call notes</h2><span>Private</span></div>
        <dl>
            <dt>You</dt>
            <dd id="transcript-status">Text appears after your pause.</dd>
            <dd id="transcript">—</dd>
            <dt id="agent-name">Agent</dt>
            <dd id="agent-text">—</dd>
        </dl>
    </section>
    </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
