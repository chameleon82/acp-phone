<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ACP Phone</title>
    <meta name="theme-color" content="#0b141a">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="stylesheet" href="/style.css?v=matrix-letter-shimmer-3">
</head>
<body>
<main class="call-screen">
    <section class="contacts-view" aria-labelledby="contacts-heading">
        <p class="eyebrow">ACP PHONE</p>
        <h1 id="contacts-heading">Agents</h1>
        <p class="contacts-hint">Choose an agent to start a call.</p>
        <label class="skin-picker" for="skin">Call appearance</label>
        <select id="skin" aria-label="Call appearance"></select>
        <p id="contacts-status" class="status" role="status" aria-live="polite">Loading agents…</p>
        <div id="agent-list" class="agent-list"></div>
    </section>
</main>
<script type="module" src="/contacts.js?v=fullscreen-after-audio-3"></script>
<script type="module" src="./pwa.js"></script>
</body>
</html>
