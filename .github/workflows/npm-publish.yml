name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the tag matches package metadata
        run: node scripts/verify-release.mjs

      - name: Run release checks
        run: npm run check && npm test

      - name: Inspect the package tarball
        run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    needs: validate-release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install locked dependencies
        run: npm ci

      - name: Publish the tagged package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}